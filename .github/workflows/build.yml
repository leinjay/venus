name: Build iOS package

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build iOS app and Watch companion
        run: >-
          xcodebuild
          -project VenusTools.xcodeproj
          -scheme VenusTools
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/VenusTools.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/VenusTools.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload VenusTools-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VenusTools-unsigned-ipa
          path: VenusTools-unsigned.ipa
          if-no-files-found: error
