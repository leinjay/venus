name: Build iOS package

on:
  push:
    branches:
      - main
      - master
      - codex/task-module
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test task data rules
        run: swift test

      - name: Test iPhone-only packaging
        run: python3 -m unittest discover -s Tests/Packaging -v

      - name: Build iOS app and Watch companion
        run: >-
          xcodebuild
          -project VenusTools.xcodeproj
          -scheme VenusTools
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package complete iPhone and Watch IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/VenusTools.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/Watch/VenusToolsWatch.app"
          test -f "$APP_PATH/mlx-swift_Cmlx.bundle/default.metallib"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/VenusTools.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload VenusTools-iPhone-Watch-unsigned.ipa

      - name: Package iPhone-only IPA for sideloading
        run: >-
          python3 scripts/package_iphone_only.py
          VenusTools-iPhone-Watch-unsigned.ipa
          VenusTools-iPhone-only-unsigned.ipa

      - name: Upload iPhone-only IPA
        uses: actions/upload-artifact@v4
        with:
          name: VenusTools-iPhone-only-unsigned-ipa
          path: VenusTools-iPhone-only-unsigned.ipa
          if-no-files-found: error

      - name: Upload complete iPhone and Watch IPA
        uses: actions/upload-artifact@v4
        with:
          name: VenusTools-iPhone-Watch-unsigned-ipa
          path: VenusTools-iPhone-Watch-unsigned.ipa
          if-no-files-found: error

  appetize:
    name: Build Appetize iOS Simulator preview
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ARM64 iOS Simulator app
        run: >-
          xcodebuild
          -project VenusTools.xcodeproj
          -scheme VenusTools
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/AppetizeDerivedData"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package Appetize preview
        run: |
          APP_PATH="$RUNNER_TEMP/AppetizeDerivedData/Build/Products/Release-iphonesimulator/VenusTools.app"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/mlx-swift_Cmlx.bundle/default.metallib"
          xcrun lipo "$APP_PATH/VenusTools" -verify_arch arm64
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], "rb") as source:
              info = plistlib.load(source)
          if info.get("CFBundleSupportedPlatforms") != ["iPhoneSimulator"]:
              raise SystemExit("Appetize requires an iOS Simulator build, not a device IPA.")
          PY
          mkdir -p "$RUNNER_TEMP/AppetizePackage/VenusTools.app"
          rsync -a --exclude='/Watch/' "$APP_PATH/" "$RUNNER_TEMP/AppetizePackage/VenusTools.app/"
          /usr/bin/ditto -c -k --norsrc --keepParent \
            "$RUNNER_TEMP/AppetizePackage/VenusTools.app" \
            VenusTools-Appetize-iOS-Simulator.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("VenusTools-Appetize-iOS-Simulator.zip") as archive:
              names = archive.namelist()
              if "VenusTools.app/Info.plist" not in names:
                  raise SystemExit("Missing top-level simulator .app bundle.")
              if any(name.startswith(("Payload/", "VenusTools.app/Watch/")) for name in names):
                  raise SystemExit("Appetize preview must not contain IPA or Watch packaging.")
              if archive.testzip() is not None:
                  raise SystemExit("Appetize archive failed CRC validation.")
          PY

      - name: Upload Appetize preview
        uses: actions/upload-artifact@v4
        with:
          name: VenusTools-Appetize-iOS-Simulator
          path: VenusTools-Appetize-iOS-Simulator.zip
          if-no-files-found: error

      - name: Show preview instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 在 Windows 浏览器预览
          1. 下载本次运行的 `VenusTools-Appetize-iOS-Simulator` artifact。
          2. 解压 GitHub 下载的外层 ZIP，找到 `VenusTools-Appetize-iOS-Simulator.zip`，保留这个内层 ZIP。
          3. 登录 https://appetize.io/upload 并上传内层 ZIP。
          4. 处理完成后，选择 iPhone 与 iOS 17 或更新版本，启动预览。

          这是原生界面预览包。本机模型、通知和 Watch 同步请用真机验证。
          后续更新：从新一轮构建下载同名 artifact，在 Appetize 更新已有应用的 build。
          详细步骤见仓库 `docs/development/appetize-preview.md`。
          EOF
